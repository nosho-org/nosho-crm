<!doctype html>
<html lang="en" translate="no" class="notranslate">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="minimum-scale=1, initial-scale=1, width=device-width"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="google" content="notranslate" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" sizes="40x40" href="./appIcon/40.png" />
    <link rel="apple-touch-icon" sizes="58x58" href="./appIcon/58.png" />
    <link rel="apple-touch-icon" sizes="60x60" href="./appIcon/60.png" />
    <link rel="apple-touch-icon" sizes="76x76" href="./appIcon/76.png" />
    <link rel="apple-touch-icon" sizes="80x80" href="./appIcon/80.png" />
    <link rel="apple-touch-icon" sizes="87x87" href="./appIcon/87.png" />
    <link rel="apple-touch-icon" sizes="114x114" href="./appIcon/114.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="./appIcon/120.png" />
    <link rel="apple-touch-icon" sizes="128x128" href="./appIcon/128.png" />
    <link rel="apple-touch-icon" sizes="136x136" href="./appIcon/136.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="./appIcon/152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="./appIcon/167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./appIcon/180.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="./appIcon/192.png" />
    <link rel="apple-touch-icon" sizes="1024x1024" href="./appIcon/1024.png" />
    <title>Atomic CRM</title>

    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
      }

      /* Prevent accidental double-tap zoom on interactive elements */
      button,
      input,
      select,
      textarea,
      a {
        touch-action: manipulation;
      }

      .loader-container {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        background-color: #fafafa;
      }

      /* CSS Spinner from https://projects.lukehaas.me/css-loaders/ */

      .loader,
      .loader:before,
      .loader:after {
        border-radius: 50%;
      }

      .loader {
        color: #283593;
        font-size: 11px;
        text-indent: -99999em;
        margin: 55px auto;
        position: relative;
        width: 10em;
        height: 10em;
        box-shadow: inset 0 0 0 1em;
        -webkit-transform: translateZ(0);
        -ms-transform: translateZ(0);
        transform: translateZ(0);
      }

      .loader:before,
      .loader:after {
        position: absolute;
        content: "";
      }

      .loader:before {
        width: 5.2em;
        height: 10.2em;
        background: #fafafa;
        border-radius: 10.2em 0 0 10.2em;
        top: -0.1em;
        left: -0.1em;
        -webkit-transform-origin: 5.2em 5.1em;
        transform-origin: 5.2em 5.1em;
        -webkit-animation: load2 2s infinite ease 1.5s;
        animation: load2 2s infinite ease 1.5s;
      }

      .loader:after {
        width: 5.2em;
        height: 10.2em;
        background: #fafafa;
        border-radius: 0 10.2em 10.2em 0;
        top: -0.1em;
        left: 5.1em;
        -webkit-transform-origin: 0px 5.1em;
        transform-origin: 0px 5.1em;
        -webkit-animation: load2 2s infinite ease;
        animation: load2 2s infinite ease;
      }

      @-webkit-keyframes load2 {
        0% {
          -webkit-transform: rotate(0deg);
          transform: rotate(0deg);
        }
        100% {
          -webkit-transform: rotate(360deg);
          transform: rotate(360deg);
        }
      }

      @keyframes load2 {
        0% {
          -webkit-transform: rotate(0deg);
          transform: rotate(0deg);
        }
        100% {
          -webkit-transform: rotate(360deg);
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loader-container">
        <div class="loader">Loading...</div>
      </div>
    </div>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!--
      Out-of-bundle boot watchdog.

      Everything able to recover from a failed boot — Sentry.init (src/sentry.ts),
      the vite:preloadError listener (src/main.tsx) and nukeCachesAndReload()
      (layout/useVersionCheck.ts) — lives INSIDE the entry bundle. When that
      bundle itself fails to load (deleted by a deploy, or a frozen service worker
      precaching a build that no longer exists), none of it runs: the spinner
      above spins forever over a blank page and nothing is reported.

      This inline script is the only code left standing, so it must stay
      self-contained — no imports, no module syntax.
    -->
    <script>
      (function () {
        var GUARD = "nosho.boot-recovery";
        var FORCE = "nosho.boot-watchdog.force";
        var BOOT_TIMEOUT_MS = 20000;
        var PROBE_TIMEOUT_MS = 4000;
        var settled = false;

        // None of this applies to a Vite dev server: VitePWA declares no
        // devOptions, so there is no service worker and no precache to repair,
        // and no deploy has deleted anything. What localhost DOES produce is a
        // failing entry whenever the dev server restarts or a compile error
        // makes Vite answer 500 — and the watchdog used to answer that with a
        // fatal alert in the production Sentry project, a wipe of the origin's
        // caches, and a failure screen hiding Vite's real error message
        // (NOSHO-CRM-W / NOSHO-CRM-V).
        //
        // `vite preview` also serves from localhost, so keep a way back in to
        // exercise this code against a real production build.
        function localOrigin() {
          var h = location.hostname;
          return (
            h === "localhost" ||
            h === "127.0.0.1" ||
            h === "::1" ||
            h === "[::1]" ||
            /\.local$/.test(h)
          );
        }

        function forced() {
          try {
            return (
              location.search.indexOf("bootwatchdog=1") !== -1 ||
              localStorage.getItem(FORCE) === "1"
            );
          } catch (e) {
            return false;
          }
        }

        if (localOrigin() && !forced()) return;

        function mounted() {
          var root = document.getElementById("root");
          return !!root && !root.querySelector(".loader-container");
        }

        // Best effort only: never let telemetry get in the way of recovery.
        function report(reason) {
          try {
            var id =
              window.crypto && window.crypto.randomUUID
                ? window.crypto.randomUUID().replace(/-/g, "")
                : String(Math.random()).slice(2, 34);
            var now = new Date().toISOString();
            navigator.sendBeacon(
              "https://o4510487498588160.ingest.de.sentry.io/api/4511047848427600/envelope/?sentry_key=a318a734cf9c27db5f2b890b5688b1a0&sentry_version=7",
              JSON.stringify({ event_id: id, sent_at: now }) +
                "\n" +
                JSON.stringify({ type: "event" }) +
                "\n" +
                JSON.stringify({
                  event_id: id,
                  timestamp: now,
                  level: "fatal",
                  platform: "javascript",
                  logger: "boot-watchdog",
                  message: { formatted: "App failed to boot: " + reason },
                  tags: { boot_failure: reason },
                  request: { url: location.href },
                }),
            );
          } catch (e) {
            /* ignore */
          }
        }

        // Same sequence as nukeCachesAndReload() in useVersionCheck.ts, 3s
        // fallback timer included. Duplicated rather than imported: by
        // definition, the bundle exporting it is what failed to load.
        function purge() {
          var fallback = setTimeout(function () {
            location.reload();
          }, 3000);
          var jobs = [];
          if ("serviceWorker" in navigator) {
            jobs.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(
                  regs.map(function (r) {
                    return r.unregister();
                  }),
                );
              }),
            );
          }
          if ("caches" in window) {
            jobs.push(
              caches.keys().then(function (keys) {
                return Promise.all(
                  keys.map(function (k) {
                    return caches.delete(k);
                  }),
                );
              }),
            );
          }
          Promise.all(jobs)
            .catch(function () {})
            .then(function () {
              clearTimeout(fallback);
              location.reload();
            });
        }

        // An error event on a <script> carries no status code, so "the deploy
        // deleted this bundle" and "the phone went into a tunnel" arrive here
        // looking identical. Purging repairs the first and is pure damage for
        // the second — it throws away a healthy precache over a blip — so ask
        // the network which one it is before touching anything. Anything other
        // than a clear "gone" answer, timeout included, counts as reachable:
        // the destructive branch has to be the one that earns its way in.
        function confirmGone(src, done) {
          if (!src || navigator.onLine === false) return done(false);
          var answered = false;
          function answer(gone) {
            if (answered) return;
            answered = true;
            clearTimeout(timer);
            done(gone);
          }
          var timer = setTimeout(function () {
            answer(false);
          }, PROBE_TIMEOUT_MS);
          try {
            fetch(src, { cache: "no-store" })
              .then(function (res) {
                answer(res.status === 404 || res.status === 403);
              })
              .catch(function () {
                answer(false);
              });
          } catch (e) {
            answer(false);
          }
        }

        function showFailure() {
          var root = document.getElementById("root");
          if (!root) return;
          root.innerHTML =
            '<div class="loader-container" style="gap:16px;text-align:center;padding:24px">' +
            "<p>Impossible de charger l'application.</p>" +
            '<button type="button" id="boot-retry" style="padding:8px 16px;cursor:pointer">' +
            "Réparer et recharger</button></div>";
          var btn = document.getElementById("boot-retry");
          if (btn) btn.addEventListener("click", purge);
        }

        // One automatic attempt only: a repair that does not fix it must never
        // turn into a reload loop. The guard records WHICH repair was tried, so
        // the second failure reports under its own reason — the "-after-" ones
        // mean self-repair did not work and a human needs to look, which is the
        // one worth alerting on.
        function recover(reason, src) {
          // Claim the boot synchronously: the probe below is async, and neither
          // a second error event nor the boot timeout may slip through while it
          // is in flight.
          if (settled || mounted()) return;
          settled = true;
          var tried = null;
          try {
            tried = sessionStorage.getItem(GUARD);
          } catch (e) {
            /* ignore */
          }
          if (tried) {
            report(
              reason + "-after-" + (tried === "reload" ? "reload" : "purge"),
            );
            showFailure();
            return;
          }
          confirmGone(src, function (gone) {
            report(gone ? reason : "entry-script-unreachable");
            try {
              sessionStorage.setItem(GUARD, gone ? "purge" : "reload");
            } catch (e) {
              /* ignore */
            }
            // Reachable, just not right now: retry once without unregistering
            // the service worker, so a transient blip costs a reload and not
            // the user's offline copy of the app.
            if (gone) purge();
            else location.reload();
          });
        }

        // The entry <script> failed to fetch (404/503). error events do not
        // bubble, hence the capture phase. Matching the id rather than
        // `type === "module"` keeps /@vite/client, the react-refresh preamble
        // and any future third-party module script out of this: only the tag
        // that actually boots the app counts as a failed boot.
        document.addEventListener(
          "error",
          function (e) {
            var el = e.target;
            if (el && el.id === "app-entry") {
              recover("entry-script-failed", el.src);
            }
          },
          true,
        );

        // Wider net: the script loaded but React never mounted. Reports and
        // shows the failure screen, but does NOT purge — a slow connection must
        // not cost the user a healthy service worker.
        setTimeout(function () {
          if (settled || mounted()) return;
          settled = true;
          report("boot-timeout");
          showFailure();
        }, BOOT_TIMEOUT_MS);

        // Booted cleanly: drop the guard so a future failure gets its own
        // automatic repair attempt.
        window.addEventListener("load", function () {
          setTimeout(function () {
            if (!mounted()) return;
            settled = true;
            try {
              sessionStorage.removeItem(GUARD);
            } catch (e) {
              /* ignore */
            }
          }, 2000);
        });
      })();
    </script>

    <script type="module" id="app-entry" src="<%= mainScript %>"></script>
  </body>
</html>
