server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers.
    # NOTE: nginx only inherits add_header from the parent level when the current
    # level declares NO add_header of its own. Every location below that sets
    # Cache-Control must therefore repeat these two lines.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # SPA routing — redirect all paths to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Content-hashed build output (assets/index-<hash>.js) — safe to pin forever.
    # `^~` outranks every regex location, so this block wins for /assets/*.
    # try_files ... =404 keeps a missing asset a 404 instead of silently
    # serving the HTML shell as if it were JavaScript.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The service worker must NEVER be cached.
    #
    # It used to be caught by a blanket `\.(js|css|...)$` rule and served
    # `immutable, max-age=1y`. Cloudflare honoured that and pinned a June build of
    # sw.js at the edge for months: every update check re-fetched the same bytes,
    # so `registerType: "autoUpdate"` could never install a new worker, and the
    # frozen precache manifest kept pointing at bundles that later deploys had
    # deleted — a permanent white screen for anyone holding that worker.
    #
    # `location =` (exact match) has the highest priority of all location types,
    # ahead of any regex, so this rule cannot be shadowed again.
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Workbox runtime emitted next to sw.js — content-hashed, so pinning is fine.
    location ~ ^/workbox-[A-Za-z0-9_-]+\.js$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # HTML shell, version probe and PWA manifest: always revalidate. These names
    # are stable, so a cached copy is a stale copy.
    location = /index.html {
        expires off;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /version.json {
        expires off;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /manifest.json {
        expires off;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Unhashed static files from public/ (icons, favicon, fonts). Short cache —
    # their names never change, so `immutable` would pin them the same way sw.js
    # was pinned.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
